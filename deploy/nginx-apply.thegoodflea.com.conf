# Public application form: apply.thegoodflea.com (example; see DEPLOYMENT.md "Public application form").
#
# Only /api/v1/public/ reaches Django. Everything else is the static SPA build, so the staff API and
# /admin/ are not reachable from this host. Certbot adds the HTTPS server block (443) when the
# certificate is issued, as for ops.thegoodflea.com.
#
# Django counts throttles by the LAST address in X-Forwarded-For (NUM_PROXIES = 1), which is the one
# nginx appends here. Keep exactly one proxy in front of gunicorn: if a CDN or another proxy is ever
# put in front of nginx, NUM_PROXIES and this header must be revisited.
server {
    listen 80;
    listen [::]:80;
    server_name apply.thegoodflea.com;

    # Built public form (the frontend's apply build).
    root /var/www/vendor-apply/current;
    index index.html;

    # The form posts small JSON bodies only.
    client_max_body_size 64k;

    location /api/v1/public/ {
        proxy_pass http://unix:/run/vendor-ops/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # No staff API, admin or static admin files on this host.
    location /api/ {
        return 404;
    }

    location /admin/ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}
